    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

v><\u002Fsc-if>\n          <sc-if value=\"{{ isSignin }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ doSignIn }}\" style=\"{{ authBtnStyle }}\">{{ signinLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goForgot }}\" style=\"display:block;margin:18px auto 0;background:none;border:none;color:#1C6EA6;font-size:14.5px;font-weight:600;cursor:pointer;\">Forgot password?<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isSignup }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ doSignUp }}\" style=\"{{ authBtnStyle }}\">{{ signupLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isForgot }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:22px;font-weight:800;margin-bottom:6px;\">Reset your password<\u002Fdiv>\n          <div style=\"font-size:14.5px;color:#6b7280;margin-bottom:20px;line-height:1.45;\">Enter your email and we'll send you a link to choose a new password.<\u002Fdiv>\n          <input type=\"email\" sc-camel-auto-complete=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@example.com\" style=\"width:100%;border:1px solid #dde0e5;border-radius:13px;padding:15px 16px;font-size:16px;background:#fff;outline:none;margin-bottom:16px;\">\n          <sc-if value=\"{{ hasAuthErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#fdecea;color:#b4342f;border-radius:11px;padding:11px 14px;font-size:14px;margin-bottom:14px;\">{{ authErr }}<\u002Fdiv><\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ doForgot }}\" style=\"{{ authBtnStyle }}\">{{ forgotLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goSignin }}\" style=\"display:block;margin:18px auto 0;background:none;border:none;color:#1C6EA6;font-size:14.5px;font-weight:600;cursor:pointer;\">Back to sign in<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <sc-if valu Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= SET NEW PASSWORD ================= -->\n  <sc-if value=\"{{ showRecovery }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;background:rgba(15,20,35,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;\">\n    <div style=\"background:#fff;width:100%;max-width:420px;border-radius:20px;padding:24px;\">\n      <div style=\"font-size:21px;font-weight:800;margin-bottom:6px;\">Choose a new password<\u002Fdiv>\n      <div style=\"font-size:14px;color:#6b7280;margin-bottom:16px;\">At least 8 characters.<\u002Fdiv>\n      <input type=\"password\" sc-camel-auto-complete=\"new-password\" value=\"{{ newPw }}\" sc-camel-on-change=\"{{ onNewPw }}\" placeholder=\"New password\" style=\"width:100%;border:1px solid #dde0e5;border-radius:13px;padding:15px 16px;font-size:16px;outline:none;margin-bottom:16px;\">\n      <button sc-camel-on-click=\"{{ doSetPw }}\" style=\"width:100%;background:#F2911E;color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;\">Save password<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:#141c2b;color:#fff;padding:13px 22px;border-radius:12px;font-size:14.5px;font-weight:600;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center;\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  API_URL='https://clxqottgngspwbujusyh.supabase.co';\n  KEY='sb_publishable_ejKp_MOTjorCjBAS9aYY9g_WnLfiaDn';\n  DOW=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];\n  SH=['M','T','W','T','F','S','S'];\n  MAX_SEC=30; MAX_MB=50;\n  state={ session:null, authMode:'signin', email:'', password:'', password2:'', authErr:'', authMsg:'', authBusy:false,\n    loading:false, access:null, notLinked:false, loadErr:'', tab:'home', openDay:null, openEx:null,\n    logs:{}, checkins:[], ciFilter:'all', composer:null, videoUrls:{}, toast:'', recovery:false, newPw:'', seen:[] };\n\n  async componentDidMount(){\n    let seen=[]; try{ seen=JSON.parse(localStorage.getItem('primed_client_seen')||'[]'); }catch(e){}\n    this.setState({seen});\n    const h=new URLSearchParams((location.hash||'').replace(/^#/,''));\n    const clearHash=()=>{ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} };\n    if(h.get('error_description')){ clearHash(); this.setState({authErr:h.get('error_description').replace(/\\+/g,' ')}); }\n    if(h.get('access_token')){\n      const tok=h.get('access_token'); clearHash();\n      const u=await this.getUser(tok);\n      if(u){\n        this.saveSession({access_token:tok, refresh_token:h.get('refresh_token'), expires_at:Date.now()+(parseInt(h.get('expires_in')||'3600',10)*1000), email:u.email, user_id:u.id});\n        if(h.get('type')==='recovery') this.setState({recovery:true}); else this.flash('Email confirmed — welcome!');\n        this.loadAll();\n      }\n    } else {\n      const s=this.readSession();\n      if(s){ this._sess=s; this.setState({session:s}, ()=>this.loadAll()); }\n    }\n    this._focus=()=>{ if(this._sess && !this.state.composer && this.state.access) this.loadAll(true); };\n    window.addEventListener('focus', this._focus);\n  }\n  componentWillUnmount(){ window.removeEventListener('focus', this._focus); }\n\n  // ---------- auth ----------\n  readSession(){ try{ return JSON.parse(localStorage.getItem('primed_client_session')||'null'); }catch(e){ return null; } }\n  saveSession(s){ this._sess=s; if(s) localStorage.setItem('primed_client_session', JSON.stringify(s)); else localStorage.removeItem('primed_client_session'); this.setState({session:s}); }\n  async getUser(tok){ try{ const r=await fetch(this.API_URL+'/auth/v1/user',{headers:{apikey:this.KEY, Authorization:'Bearer '+tok}}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }\n  async fresh(){\n    const s=this._sess; if(!s) return null;\n    if(s.expires_at && Date.now()<s.expires_at-60000) return s.access_token;\n    try{\n      const r=await fetch(this.API_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:this.KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});\n      if(!r.ok) throw new Error('refresh');\n      const d=await r.json();\n      const ns={...s, access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+((d.expires_in||3600)*1000)};\n      this.saveSession(ns); return ns.access_token;\n    }catch(e){ this.saveSession(null); this.setState({access:null}); this.flash('Please sign in again'); return null; }\n  }\n  async api(path, opts={}){\n    const tok=await this.fresh(); if(!tok) throw new Error('auth');\n    return fetch(this.API_URL+path,{...opts, headers:{apikey:this.KEY, Authorization:'Bearer '+tok, 'Content-Type':'application/json', ...(opts.headers||{})}});\n  }\n  flash(m){ clearTimeout(this._tt); this.setState({toast:m}); this._tt=setTimeout(()=>this.setState({toast:''}),2800); }\n  redirectUrl(){ return location.origin+location.pathname; }\n  sessFrom(d){ return {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+((d.expires_in||3600)*1000), email:d.user.email, user_id:d.user.id}; }\n\n  doSignIn=async()=>{\n    const email=this.state.email.trim(), pw=this.state.password;\n    if(!email||!pw){ this.setState({authErr:'Enter your email and password.'}); return; }\n    this.setState({authBusy:true, authErr:''});\n    try{\n      const r=await fetch(this.API_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:this.KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});\n      const d=await r.json();\n      if(!r.ok||!d.access_token){\n        let m=d.error_description||d.msg||'Sign-in failed.';\n        if(/confirm/i.test(m)) m='Please confirm your email first — check your inbox for the link.';\n        else if(/invalid/i.test(m)) m='Wrong email or password.';\n        this.setState({authBusy:false, authErr:m}); return;\n      }\n      this.saveSession(this.sessFrom(d));\n      this.setState({authBusy:false, password:'', password2:''}); this.loadAll();\n    }catch(e){ this.setState({authBusy:false, authErr:'Could not reach the server. Check your connection.'}); }\n  };\n  doSignUp=async()=>{\n    const email=this.state.email.trim(), pw=this.state.password;\n    if(!email||!pw){ this.setState({authErr:'Enter your email and a password.'}); return; }\n    if(pw.length<8){ this.setState({authErr:'Use at least 8 characters for your password.'}); return; }\n    if(pw!==this.state.password2){ this.setState({authErr:\"Passwords don't match.\"}); return; }\n    this.setState({authBusy:true, authErr:''});\n    try{\n      const r=await fetch(this.API_URL+'/auth/v1/signup?redirect_to='+encodeURIComponent(this.redirectUrl()),{method:'POST',headers:{apikey:this.KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});\n      const d=await r.json();\n      if(!r.ok){\n        let m=d.msg||d.error_description||'Could not create your account.';\n        if(/already/i.test(m)) m='An account with this email already exists — try signing in.';\n        this.setState({authBusy:false, authErr:m}); return;\n      }\n      if(d.access_token){ this.saveSession(this.sessFrom(d)); this.setState({authBusy:false,password:'',password2:''}); this.loadAll(); return; }\n      this.setState({authBusy:false, password:'', password2:'', authMode:'check', authMsg:'We sent a confirmation link to '+email+'. Open it on this phone to finish setting up your account, then sign in.'});\n    }catch(e){ this.setState({authBusy:false, authErr:'Could not reach the server. Check your connection.'}); }\n  };\n  doForgot=async()=>{\n    const email=this.state.email.trim();\n    if(!email){ this.setState({authErr:'Enter your email.'}); return; }\n    this.setState({authBusy:true, authErr:''});\n    try{ await fetch(this.API_URL+'/auth/v1/recover?redirect_to='+encodeURIComponent(this.redirectUrl()),{method:'POST',headers:{apikey:this.KEY,'Content-Type':'application/json'},body:JSON.stringify({email})}); }catch(e){}\n    this.setState({authBusy:false, authMode:'check', authMsg:'If an account exists for '+email+', a link to reset your password is on its way.'});\n  };\n  doSetPw=async()=>{\n    const pw=this.state.newPw;\n    if(pw.length<8){ this.flash('Use at least 8 characters'); return; }\n    try{ const r=await this.api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:pw})}); if(!r.ok) throw new Error(); this.setState({recovery:false,newPw:''}); this.flash('Password updated ✓'); }\n    catch(e){ this.flash('Could not update password'); }\n  };\n  signOut=()=>{ this.saveSession(null); this.setState({access:null, notLinked:false, logs:{}, checkins:[], tab:'home', openDay:null, openEx:null, authMode:'signin', password:'', composer:null}); };\n\n  // ---------- data ----------\n  async loadAll(quiet){\n    if(!quiet) this.setState({loading:true, loadErr:''});\n    try{\n      const r=await this.api('/rest/v1/client_access?select=*');\n      if(!r.ok) throw new Error('HTTP '+r.status);\n      const rows=await r.json();\n      if(!rows.length){ this.setState({loading:false, access:null, notLinked:true}); return; }\n      this.setState({access:rows[0], notLinked:false});\n      await Promise.all([this.loadLogs(), this.loadCheckins(), this.loadHistory()]);\n      this.setState({loading:false});\n    }catch(e){ if(e.message==='auth') return; this.setState({loading:false, loadErr:'Check your connection and try again.'}); }\n  }\n  async loadLogs(){\n    const w=this.weekDates();\n    const r=await this.api('/rest/v1/workout_logs?select=log_date,day_key,data&log_date=gte.'+w[0]+'&log_date=lte.'+w[6]);\n    if(!r.ok) return;\n    const rows=await r.json(); const logs={};\n    rows.forEach(x=>{ logs[x.log_date+'|'+x.day_key]=x.data||{ex:{}}; });\n    Object.keys(this._pend||{}).forEach(k=>{ if(this.state.logs[k]) logs[k]=this.state.logs[k]; });\n    this.setState({logs});\n  }\n  async loadHistory(){\n    const w=this.weekDates();\n    const r=await this.api('/rest/v1/workout_logs?select=log_date,day_key,data&log_date=lt.'+this.todayStr()+'&order=log_date.desc&limit=120');\n    if(!r.ok) return;\n    const rows=await r.json(); const byKey={}, byName={};\n    rows.forEach(x=>{ const ex=(x.data&&x.data.ex)||{}; Object.keys(ex).forEach(k=>{ const v=ex[k]; if(!v||!v.sets||!v.sets.some(s=>s&&(s.w||s.r))) return; const rec={date:x.log_date, sets:v.sets}; if(!byKey[k]) byKey[k]=rec; const nm=String(v.name||'').trim().toLowerCase(); if(nm&&!byName[nm]) byName[nm]=rec; }); });\n    this.setState({hist:{byKey, byName}});\n  }\n  lastFor(key, name){ const h=this.state.hist; if(!h) return null; return h.byKey[key] || h.byName[String(name||'').trim().toLowerCase()] || null; }\n  async loadCheckins(){\n    const r=await this.api('/rest/v1/checkins?select=*&order=created_at.desc&limit=100');\n    if(!r.ok) return;\n    this.setState({checkins:await r.json()});\n  }\n  queueSave(k, dayKey){\n    this._pend=this._pend||{};\n    clearTimeout(this._pend[k]);\n    this._pend[k]=setTimeout(async()=>{\n      delete this._pend[k];\n      const data=this.state.logs[k]; const s=this._sess; if(!data||!s) return;\n      try{\n        const r=await this.api('/rest/v1/workout_logs?on_conflict=user_id,log_date,day_key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},\n          body:JSON.stringify([{user_id:s.user_id, log_date:k.split('|')[0], day_key:dayKey, email:s.email, program_id:(this.state.access&&this.state.access.program_id)||null, data, updated_at:new Date().toISOString
