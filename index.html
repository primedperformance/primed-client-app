    // document mints the blobs for its OWN frames, obtaining page text

    // its direct parent (which, for every document the publisher's own

    // text from that direct parent; requests from below are honored only

    // computed from the URL and stays 'https://…' even when the document

      // and sender identity (own child frame / direct parent) is checked

    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"b486f58b-80c6-4eae-a09b-3af4df14606d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"17c3d905-a5da-4f6d-b5d0-889a7ca48a9c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"3f3a59ab-ddd4-4531-8cf6-cbdf67749375\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"b486f58b-80c6-4eae-a09b-3af4df14606d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"PRIMED\">\n<meta name=\"theme-color\" content=\"#1C6EA6\">\n<style>\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}\n  body{margin:0;background:#f6f7f9;font-family:'Archivo','Helvetica Neue',Arial,sans-serif;color:#141c2b;-webkit-font-smoothing:antialiased;}\n  input,textarea,button{font-family:inherit;}\n  a{color:#1C6EA6;} a:hover{color:#F2911E;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;font-family:'Archivo','Helvetica Neue',Arial,sans-serif;color:#141c2b;\">\n\n  <!-- ================= AUTH ================= -->\n  <sc-if value=\"{{ showAuth }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;display:flex;flex-direction:column;background:#1C6EA6;\">\n    <div style=\"padding:calc(env(safe-area-inset-top) + 48px) 28px 34px;max-width:520px;width:100%;margin:0 auto;\">\n      <img src=\"d44b13cc-310a-486b-9a95-c3924c1acc76\" alt=\"PRIMED Performance Therapy\" style=\"height:34px;width:auto;margin-bottom:26px;\">\n      <div style=\"color:#fff;font-size:29px;font-weight:800;letter-spacing:-.4px;line-height:1.15;text-wrap:pretty;\">Your program, on your phone<\u002Fdiv>\n      <div style=\"color:#cfe0ee;font-size:15.5px;margin-top:8px;line-height:1.45;\">Sign in to see the program your coach built for you.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:#f6f7f9;border-radius:28px 28px 0 0;padding:26px 22px 40px;\">\n      <div style=\"max-width:440px;margin:0 auto;\">\n\n        <sc-if value=\"{{ showAuthTabs }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;background:#eceef1;border-radius:13px;padding:4px;gap:4px;margin-bottom:22px;\">\n            <button sc-camel-on-click=\"{{ goSignin }}\" style=\"{{ tabSigninStyle }}\">Sign in<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goSignup }}\" style=\"{{ tabSignupStyle }}\">Create account<\u002Fbutton>\n          <\u002Fdiv>\n          <label style=\"display:block;font-size:14px;font-weight:600;color:#374151;margin-bottom:7px;\">Email<\u002Flabel>\n          <input type=\"email\" sc-camel-auto-complete=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@example.com\" style=\"width:100%;border:1px solid #dde0e5;border-radius:13px;padding:15px 16px;font-size:16px;background:#fff;outline:none;margin-bottom:16px;\">\n          <label style=\"display:block;font-size:14px;font-weight:600;color:#374151;margin-bottom:7px;\">Password<\u002Flabel>\n          <input type=\"password\" sc-camel-auto-complete=\"{{ pwAutocomplete }}\" value=\"{{ password }}\" sc-camel-on-change=\"{{ onPassword }}\" placeholder=\"{{ pwPlaceholder }}\" style=\"width:100%;border:1px solid #dde0e5;border-radius:13px;padding:15px 16px;font-size:16px;background:#fff;outline:none;margin-bottom:16px;\">\n          <sc-if value=\"{{ isSignup }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:block;font-size:14px;font-weight:600;color:#374151;margin-bottom:7px;\">Confirm password<\u002Flabel>\n            <input type=\"password\" sc-camel-auto-complete=\"new-password\" value=\"{{ password2 }}\" sc-camel-on-change=\"{{ onPassword2 }}\" placeholder=\"Type it again\" style=\"width:100%;border:1px solid #dde0e5;border-radius:13px;padding:15px 16px;font-size:16px;background:#fff;outline:none;margin-bottom:16px;\">\n            <div style=\"font-size:13px;color:#6b7280;line-height:1.45;margin:-4px 0 18px;\">Use the same email your coach has on file. We'll send a link to confirm it.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasAuthErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#fdecea;color:#b4342f;border-radius:11px;padding:11px 14px;font-size:14px;margin-bottom:14px;line-height:1.4;\">{{ authErr }}<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ isSignin }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ doSignIn }}\" style=\"{{ authBtnStyle }}\">{{ signinLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goForgot }}\" style=\"display:block;margin:18px auto 0;background:none;border:none;color:#1C6EA6;font-size:14.5px;font-weight:600;cursor:pointer;\">Forgot password?<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isSignup }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ doSignUp }}\" style=\"{{ authBtnStyle }}\">{{ signupLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isForgot }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:22px;font-weight:800;margin-bottom:6px;\">Reset your password<\u002Fdiv>\n          <div style=\"font-size:14.5px;color:#6b7280;margin-bottom:20px;line-height:1.45;\">Enter your email and we'll send you a link to choose a new password.<\u002Fdiv>\n          <input type=\"email\" sc-camel-auto-complete=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@example.com\" style=\"width:100%;border:1px solid #dde0e5;border-radius:13px;padding:15px 16px;font-size:16px;background:#fff;outline:none;margin-bottom:16px;\">\n          <sc-if value=\"{{ hasAuthErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#fdecea;color:#b4342f;border-radius:11px;padding:11px 14px;font-size:14px;margin-bottom:14px;\">{{ authErr }}<\u002Fdiv><\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ doForgot }}\" style=\"{{ authBtnStyle }}\">{{ forgotLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goSignin }}\" style=\"display:block;margin:18px auto 0;background:none;border:none;color:#1C6EA6;font-size:14.5px;font-weight:600;cursor:pointer;\">Back to sign in<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isCheck }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"width:58px;height:58px;border-radius:16px;background:#eaf2f9;color:#1C6EA6;display:flex;align-items:center;justify-content:center;margin-bottom:18px;\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"><\u002Frect><polyline points=\"22 6 12 13 2 6\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-size:22px;font-weight:800;margin-bottom:8px;\">Check your email<\u002Fdiv>\n          <div style=\"font-size:15px;color:#4b5563;line-height:1.5;margin-bottom:24px;\">{{ authMsg }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goSignin }}\" style=\"width:100%;background:#fff;color:#141c2b;border:1px solid #dde0e5;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;\">Back to sign in<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= APP ================= -->\n  <sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;background:#f6f7f9;\">\n    <div style=\"max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(env(safe-area-inset-bottom) + 92px);\">\n\n      <sc-if value=\"{{ showLoading }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:120px 24px;text-align:center;color:#9aa1ac;font-size:15px;\">Loading your program…<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showLoadErr }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:100px 28px;text-align:center;\">\n          <div style=\"font-size:17px;font-weight:700;margin-bottom:8px;\">Couldn't load your program<\u002Fdiv>\n          <div style=\"font-size:14.5px;color:#6b7280;margin-bottom:22px;line-height:1.45;\">{{ loadErr }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ retry }}\" style=\"background:#F2911E;color:#fff;border:none;border-radius:12px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;\">Try again<\u002Fbu een=[]; try{ seen=JSON.parse(localStorage.getItem('primed_client_seen')||'[]'); }catch(e){}\n    this.setState({seen});\n    const h=new URLSearchParams((location.hash||'').replace(/^#/,''));\n    const clearHash=()=>{ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} };\n    if(h.get('error_description')){ clearHash(); this.setState({authErr:h.get('error_description').replace(/\\+/g,' ')}); }\n    if(h.get('access_token')){\n      const tok=h.get('access_token'); clearHash();\n      const u=await this.getUser(tok);\n      if(u){\n        this.saveSession({access_token:tok, refresh_token:h.get('refresh_token'), expires_at:Date.now()+(parseInt(h.get('expires_in')||'3600',10)*1000), email:u.email, user_id:u.id});\n        if(h.get('type')==='recovery') this.setState({recovery:true}); else this.flash('Email confirmed — welcome!');\n        this.loadAll();\n      }\n    } else {\n      const s=this.readSession();\n      if(s){ this._sess=s; this.setState({session:s}, ()=>this.loadAll()); }\n    }\n    this._focus=()=>{ if(this._sess && !this.state.composer && this.state.access) this.loadAll(true); };\n    window.addEventListener('focus', this._focus);\n  }\n  componentWillUnmount(){ window.removeEventListener('focus', this._focus); }\n\n  // ---------- auth ----------\n  readSession(){ try{ return JSON.parse(localStorage.getItem('primed_client_session')||'null'); }catch(e){ return null; } }\n  saveSession(s){ this._sess=s; if(s) localStorage.setItem('primed_client_session', JSON.stringify(s)); else localStorage.removeItem('primed_client_session'); this.setState({session:s}); }\n  async getUser(tok){ try{ const r=await fetch(this.API_URL+'/auth/v1/user',{headers:{apikey:this.KEY, Authorization:'Bearer '+tok}}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }\n  async fresh(){\n    const s=this._sess; if(!s) return null;\n    if(s.expires_at && Date.now()<s.expires_at-60000) return s.access_token;\n    try{\n      const r=await fetch(this.API_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:this.KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});\n      if(!r.ok) throw new Error('refresh');\n      const d=await r.json();\n      const ns={...s, access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+((d.expires_in||3600)*1000)};\n      this.saveSession(ns); return ns.access_token;\n    }catch(e){ this.saveSession(null); this.setState({access:null}); this.flash('Please sign in again'); return null; }\n  }\n  async api(path, opts={}){\n    const tok=await this.fresh(); if(!tok) throw new Error('auth');\n    return fetch(this.API_URL+path,{...opts, headers:{apikey:this.KEY, Authorization:'Bearer '+tok, 'Content-Type':'application/json', ...(opts.headers||{})}});\n  }\n  flash(m){ clearTimeout(this._tt); this.setState({toast:m}); this._tt=setTimeout(()=>this.setState({toast:''}),2800); }\n  redirectUrl(){ return location.origin+location.pathname; }\n  sessFrom(d){ return {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+((d.expires_in||3600)*1000), email:d.user.email, user_id:d.user.id}; }\n\n  doSignIn=async()=>{\n    const email=this.state.email.trim(), pw=this.state.password;\n    if(!email||!pw){ this.setState({authErr:'Enter your email and password.'}); return; }\n    this.setState({authBusy:true, authErr:''});\n    try{\n      const r=await fetch(this.API_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:this.KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});\n      const d=await r.json();\n      if(!r.ok||!d.access_token){\n        let m=d.error_description||d.msg||'Sign-in failed.';\n        if(/confirm/i.test(m)) m='Please confirm your email first — check your inbox for the link.';\n        else if(/invalid/i.test(m)) m='Wrong email or password.';\n        this.setState({authBusy:false, authErr:m}); return;\n      }\n      this.saveSession(this.sessFrom(d));\n      this.setState({authBusy:false, password:'', password2:''}); this.loadAll();\n    }catch(e){ this.setState({authBusy:false, authErr:'Could not reach the server. Check your connection.'}); }\n  };\n  doSignUp=async()=>{\n    const email=this.state.email.trim(), pw=this.state.password;\n    if(!email||!pw){ this.setState({authErr:'Enter your email and a password.'}); return; }\n    if(pw.length<8){ this.setState({authErr:'Use at least 8 characters for your password.'}); return; }\n    if(pw!==this.state.password2){ this.setState({authErr:\"Passwords don't match.\"}); return; }\n    this.setState({authBusy:true, authErr:''});\n    try{\n      const r=await fetch(this.API_URL+'/auth/v1/signup?redirect_to='+encodeURIComponent(this.redirectUrl()),{method:'POST',headers:{apikey:this.KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});\n      const d=await r.json();\n      if(!r.ok){\n        let m=d.msg||d.error_description||'Could not create your account.';\n        if(/already/i.test(m)) m='An account with this email already exists — try signing in.';\n        this.setState({authBusy:false, authErr:m}); return;\n      }\n      if(d.access_token){ this.saveSession(this.sessFrom(d)); this.setState({authBusy:false,password:'',password2:''}); this.loadAll(); return; }\n      this.setState({authBusy:false, password:'', password2:'', authMode:'check', authMsg:'We sent a confirmation link to '+email+'. Open it on this phone to finish setting up your account, then sign in.'});\n    }catch(e){ this.setState({authBusy:false, authErr:'Could not reach the server. Check your connection.'}); }\n  };\n  doForgot=async()=>{\n    const email=this.state.email.trim();\n    if(!email){ this.setState({authErr:'Enter your email.'}); return; }\n    this.setState({authBusy:true, authErr:''});\n    try{ await fetch(this.API_URL+'/auth/v1/recover?redirect_to='+encodeURIComponent(this.redirectUrl()),{method:'POST',headers:{apikey:this.KEY,'Content-Type':'application/json'},body:JSON.stringify({email})}); }catch(e){}\n    this.setState({authBusy:false, authMode:'check', authMsg:'If an account exists for '+email+', a link to reset your password is on its way.'});\n  };\n  doSetPw=async()=>{\n    const pw=this.state.newPw;\n    if(pw.length<8){ this.flash('Use at least 8 characters'); return; }\n    try{ const r=await this.api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:pw})}); if(!r.ok) throw new Error(); this.setState({recovery:false,newPw:''}); this.flash('Password updated ✓'); }\n    catch(e){ this.flash('Could not update password'); }\n  };\n  signOut=()=>{ this.saveSession(null); this.setState({access:null, notLinked:false, logs:{}, checkins:[], tab:'home', openDay:null, openEx:null, authMode:'signin', password:'', composer:null}); };\n\n  // ---------- data ----------\n  async loadAll(quiet){\n    if(!quiet) this.setState({loading:true, loadErr:''});\n    try{\n      const r=await this.api('/rest/v1/client_access?select=*');\n      if(!r.ok) throw new Error('HTTP '+r.status);\n      const rows=await r.json();\n      if(!rows.length){ this.setState({loading:false, access:null, notLinked:true}); return; }\n      this.setState({access:rows[0], notLinked:false});\n      await Promise.all([this.loadLogs(), this.loadCheckins()]);\n      this.setState({loading:false});\n    }catch(e){ if(e.message==='auth') return; this.setState({loading:false, loadErr:'Check your connection and try again.'}); }\n  }\n  async loadLogs(){\n    const w=this.weekDates();\n    const r=await this.api('/rest/v1/workout_logs?select=log_date,day_key,data&log_date=gte.'+w[0]+'&log_date=lte.'+w[6]);\n    if(!r.ok) return;\n    const rows=await r.json(); const logs={};\n    rows.forEach(x=>{ logs[x.log_date+'|'+x.day_key]=x.data||{ex:{}}; });\n    Object.keys(this._pend||{}).forEach(k=>{ if(this.state.logs[k]) logs[k]=this.state.logs[k]; });\n    this.setState({logs});\n  }\n  async loadCheckins(){\n    const r=await this.api('/rest/v1/checkins?select=*&order=created_at.desc&limit=100');\n    if(!r.ok) return;\n    this.setState({checkins:await r.json()});\n  }\n  queueSave(k, dayKey){\n    this._pend=this._pend||{};\n    clearTimeout(this._pend[k]);\n    this._pend[k]=setTimeout(async()=>{\n      delete this._pend[k];\n      const data=this.state.logs[k]; const s=this._sess; if(!data||!s) return;\n      try{\n        const r=await this.api('/rest/v1/workout_logs?on_conflict=user_id,log_date,day_key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},\n          body:JSON.stringify([{user_id:s.user_id, log_date:k.split('|')[0], day_key:dayKey, email:s.email, program_id:(this.state.access&&this.state.access.program_id)||null, data, updated_at:new Date().toISOString()}])});\n        if(!r.ok) throw new Error();\n      }catch(e){ this.flash('Not saved — check your connection'); }\n    },700);\n  }\n\n  // ---------- dates ----------\n  ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\n  todayStr(){ return this.ymd(new Date()); }\n  dowIdx(d){ return (d.getDay()+6)%7; }\n  weekDates(){ const t=new Date(); t.setHours(12,0,0,0); const m=new Date(t); m.setDate(t.getDate()-this.dowIdx(t)); return [0,1,2,3,4,5,6].map(i=>{ const d=new Date(m); d.setDate(m.getDate()+i); return this.ymd(d); }); }\n  fmtDate(iso){ try{ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){ return ''; } }\n\n  // ---------- program ----------\n  sec(v){\n    if(v===undefined||v===null) return null;\n    if(typeof v==='string') return v.trim()?{text:v,exercises:[]}:null;\n    const ex=v.exercises||[];\n    if(!String(v.text||'').trim() && !ex.length) return null;\n    return {text:v.text||'', exercises:ex};\n  }\n  hasContent(d){ return !!d && ((d.exercises&&d.exercises.length) || ['warmup','mobility','mainLift','conditioning'].some(k=>this.sec(d[k]))); }\n  entries(){\n    const a=this.state.access; const p=a&&a.program; if(!p) return [];\n    const out=[];\n    if(this.hasContent(p.everyday)) out.push({key:'everyday', label:'Every day', day:p.everyday, isEvery:true});\n    (p.days||[]).forEach((d,i)=>{ if(this.hasContent(d)) out.push({key:d.id||('d'+i), label:p.dayMode==='dow'?this.DOW[((p.startDow||0)+i)%7]:'Day '+(i+1), day:d, idx:i}); });\n    return out;\n  }\n  buildDay(day){\n    const out=[];\n    [['warmup','Warm-up','#c47d1e'],['mobility','Mobility','#0e8c6f'],['mainLift','Main Lift','#7a4fd0']].forEach(([k,t,c])=>{ const s=this.sec(day[k]); if(s) out.push({key:k,title:t,color:c,text:s.text,list:s.exercises}); });\n    if(day.exercises&&day.exercises.length) out.push({key:'main',title:'Workout',color:'#F2911E',text:'',list:day.exercises});\n    const cd=this.sec(day.conditioning); if(cd) out.push({key:'conditioning',title:'Conditioning',color:'#1C6EA6',text:cd.text,list:cd.exercises});\n    out.forEach(s=>{ s.items=s.list.map((e,i)=>({e, key:e.id||(s.key+':'+i), isEx:!e.freeText})); });\n    return out;\n  }\n  exItems(day){ const all=[]; this.buildDay(day).forEach(s=>s.items.forEach(it=>{ if(it.isEx) all.push(it); })); return all; }\n  fmtHold(h){ h=String(h||'').trim(); return /^\\d+(\\.\\d+)?$/.test(h)?h+'s':h; }\n  fmtW(w){ w=String(w||'').trim(); return (w && /^[\\d.\\-–\\s]+$/.test(w))?w+' lb':w; }\n  setsFor(e){\n    if(e.setRows&&e.setRows.length) return e.setRows;\n    const n=Math.max(1,Math.min(12,parseInt(e.sets,10)||1)); const r={reps:e.reps||'',hold:e.hold||'',weight:e.weight||'',rest:e.rest||''};\n    return Array.from({length:n},()=>r);\n  }\n  targetText(r){ return [r.reps?r.reps+' reps':'', r.hold?this.fmtHold(r.hold)+' hold':'', r.weight?this.fmtW(r.weight):''].filter(Boolean).join(' · ')||'—'; }\n  summary(e){\n    const rows=this.setsFor(e); const n=rows.length; const r0=rows[0]||{};\n    const same=rows.every(r=>r.reps===r0.reps&&r.hold===r0.hold&&r.weight===r0.weight);\n    if(!same) return n+' sets · varies by set';\n    const main=r0.reps?r0.reps:(r0.hold?this.fmtHold(r0.hold)+' hold':'');\n    return [n+(main?' × '+main:(n===1?' set':' sets')), r0.weight?this.fmtW(r0.weight):''].filter(Boolean).join(' · ');\n  }\n  segs(line){\n    const out=[]; const re=/\\[([^\\]]+)\\]\\(([^)\\s]+)\\)|((?:https?:\\/\\/|www\\.)[^\\s)]+)/g; let last=0,m; const s=String(line||'');\n    while((m=re.exec(s))){ if(m.index>last) out.push({t:s.slice(last,m.index),u:null}); if(m[1]) out.push({t:m[1],u:m[2]}); else out.push({t:m[3],u:(m[3].indexOf('www.')===0?'https://':'')+m[3]}); last=re.lastIndex; }\n    if(last<s.length) out.push({t:s.slice(last),u:null});\n    return (out.length?out:[{t:'\\u00a0',u:null}]).map(g=>({t:g.t, u:g.u||'#', isLink:!!g.u, notLink:!g.u}));\n  }\n  paras(text){ return String(text||'').split(/\\n/).map(l=>({segs:this.segs(l)})); }\n  freeParas(e){ const p=this.paras(e.text); (e.links||[]).filter(l=>l&&l.url).forEach(l=>{ const u=/^https?:/i.test(l.url)?l.url:'https://'+l.url; p.push({segs:[{t:l.label||l.url,u,isLink:true,notLink:false}]}); }); return p; }\n  ytId(u){ if(!u) return null; const m=String(u).match(/youtu\\.be\\/([\\w-]{6,})/)||String(u).match(/[?&]v=([\\w-]{6,})/)||String(u).match(/\\/(?:embed|shorts|live)\\/([\\w-]{6,})/); return m?m[1]:null; }\n\n  // ---------- logging ----------\n  mutLog(dayKey, fn){\n    const k=this.todayStr()+'|'+dayKey;\n    this.setState(s=>{\n      const logs={...s.logs}; const cur=JSON.parse(JSON.stringify(logs[k]||{ex:{}})); if(!cur.ex) cur.ex={};\n      fn(cur);\n      const ent=this.entries().find(x=>x.key===dayKey);\n      if(ent){ const items=this.exItems(ent.day); cur.complete=items.length>0 && items.every(it=>cur.ex[it.key]&&cur.ex[it.key].done); }\n      logs[k]=cur; return {logs};\n    }, ()=>this.queueSave(k, dayKey));\n  }\n  ensureEx(cur, exKey, name){ if(!cur.ex[exKey]) cur.ex[exKey]={done:false, sets:[], name}; const x=cur.ex[exKey]; x.name=name; x.sets=x.sets||[]; return x; }\n  setSetField(dayKey, exKey, name, si, f, val){ this.mutLog(dayKey, cur=>{ const x=this.ensureEx(cur,exKey,name); x.sets[si]={...(x.sets[si]||{}), [f]:val}; }); }\n  toggleSet(dayKey, exKey, name, si, n){\n    this.mutLog(dayKey, cur=>{ const x=this.ensureEx(cur,exKey,name); const was=!!(x.sets[si]&&x.sets[si].done); x.sets[si]={...(x.sets[si]||{}), done:!was};\n      let all=true; for(let i=0;i<n;i++){ if(!(x.sets[i]&&x.sets[i].done)) all=false; } x.done=all; });\n  }\n  toggleExDone(dayKey, exKey, name, n){\n    this.mutLog(dayKey, cur=>{ const x=this.ensureEx(cur,exKey,name); x.done=!x.done; for(let i=0;i<n;i++){ x.sets[i]={...(x.sets[i]||{}), done:x.done}; } });\n  }\n\n  // ---------- nav ----------\n  setTab(t){\n    const st={tab:t, openDay:null, openEx:null};\n    if(t==='checkins'){ const ids=this.state.checkins.filter(c=>c.coach_reply).map(c=>c.id); const seen=Array.from(new Set([...this.state.seen, ...ids])); st.seen=seen; try{ localStorage.setItem('primed_client_seen', JSON.stringify(seen)); }catch(e){} }\n    this.setState(st); window.scrollTo(0,0);\n  }\n  openDay(k){ this.setState({openDay:k, openEx:null}); window.scrollTo(0,0); }\n  openExercise(dk, ek){ this.setState({openDay:dk, openEx:ek}); window.scrollTo(0,0); }\n\n  // ---------- composer ----------\n  openComposer(kind, ent, it){ this.setState({composer:{kind, dayKey:ent?ent.key:null, exKey:it?it.key:null, exName:it?(it.e.name||''):'', dayLabel:ent?ent.label:'', note:'', file:null, previewUrl:null, fileInfo:'', err:'', busy:false}}); }\n  closeComposer=()=>{ const c=this.state.composer; if(c&&c.previewUrl) URL.revokeObjectURL(c.previewUrl); this.setState({composer:null}); };\n  onPickFile=async(e)=>{\n    const f=e.target.files&&e.target.files[0]; try{ e.target.value=''; }catch(_){}\n    const c=this.state.composer; if(!f||!c) return;\n    if(c.previewUrl) URL.revokeObjectURL(c.previewUrl);\n    const mb=f.size/1048576; const url=URL.createObjectURL(f);\n    const dur=await new Promise(res
